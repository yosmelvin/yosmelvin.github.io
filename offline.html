<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="robots" content="noindex">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'">
	<title>Offline — YMT Solution</title>
	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="stylesheet" href="/css/style.css">
	<style>
		body { min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
		.offline-card { text-align: center; padding: 48px 32px; max-width: 480px; }
		.offline-card h1 { font-family: 'Sora', sans-serif; font-size: 2rem; margin: 0 0 12px; }
		.offline-card p { color: var(--muted); margin: 0 0 28px; }
		.offline-card a.btn { display: inline-block; margin: 6px; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; }
		.offline-card .btn-primary { background: var(--grad); color: #0b1220; }
		.offline-card .btn-ghost { border: 1px solid var(--border); color: var(--ink); }
		.offline-card .logo { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.4rem; margin-bottom: 24px; }
		.offline-card .logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
	</style>
</head>
<body>
	<main class="offline-card">
		<div class="logo">YMT<span>Solution</span></div>
		<h1 data-off="title">You're offline</h1>
		<p data-off="body">It looks like you've lost your internet connection. The page you were looking for isn't cached yet — reconnect and try again.</p>
		<a class="btn btn-primary" href="/" data-off="home">Back to home</a>
		<a class="btn btn-ghost" href="/#portfolio" data-off="portfolio">View portfolio</a>
		<a class="btn btn-ghost" href="/#contact" data-off="contact">Contact us</a>
	</main>
	<script src="/js/offline-lang.js"></script>
</body>
</html>
