<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <title>404 — Page Not Found | YMT Solution</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/pwa/favicon-32.png">
    <link href="/fonts/fonts.css" rel="stylesheet">
    <script src="/js/theme.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#0b1220 0%,#0f172a 55%,#020617 100%);font-family:'Inter',sans-serif;color:#e2e8f0;text-align:center;padding:20px}
        .lang-pill{position:fixed;top:20px;right:20px;display:inline-flex;border:1px solid rgba(148,163,184,.3);border-radius:999px;overflow:hidden}
        .lang-btn{background:transparent;border:none;color:#94a3b8;font:600 12px 'Inter',sans-serif;padding:7px 14px;cursor:pointer}
        .lang-btn.active{background:linear-gradient(135deg,#22d3ee,#0e7490);color:#06121f}
        .code{font-family:'Sora',sans-serif;font-size:clamp(6rem,20vw,11rem);font-weight:700;background:linear-gradient(135deg,#22d3ee,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
        h1{font-family:'Sora',sans-serif;font-size:1.6rem;margin:12px 0 8px;color:#f1f5f9}
        p{color:#94a3b8;margin-bottom:32px}
        a{display:inline-block;padding:14px 34px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#0e7490);color:#06121f;font-weight:600;text-decoration:none;transition:transform .25s,box-shadow .25s}
        a:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(34,211,238,.35)}
        .links{margin-top:28px}
        .links a{padding:8px 18px;font-size:.85rem;background:rgba(255,255,255,.06);border:1px solid rgba(148,163,184,.25);color:#cbd5e1;margin:0 6px}
        .links a:hover{border-color:#22d3ee;color:#22d3ee;box-shadow:none}

html[data-theme="light"] body{background:radial-gradient(ellipse at top,#eef2fb 0%,#f8fafc 55%,#e2e8f0 100%);color:#0f172a}
html[data-theme="light"] h1{color:#0f172a}
html[data-theme="light"] p{color:#475569}
html[data-theme="light"] .lang-pill{border-color:rgba(15,23,42,.2)}
html[data-theme="light"] .lang-btn{color:#475569}
html[data-theme="light"] .code{background:linear-gradient(135deg,#0e7490,#4f46e5);-webkit-background-clip:text;background-clip:text}
html[data-theme="light"] .links a{background:rgba(15,23,42,.05);border-color:rgba(15,23,42,.2);color:#334155}
html[data-theme="light"] .links a:hover{border-color:#0e7490;color:#0e7490}

    /* Print: clean document output */
    @media print {
      .lang-toggle, .theme-toggle, .print-hide, nav, .cookie-consent, .btn { display: none !important; }
      body { background: #fff !important; color: #111 !important; }
      a { color: #111 !important; text-decoration: none; }
      .card, .post, .policy-section { box-shadow: none !important; border: 1px solid #ddd !important; break-inside: avoid; }
    }
    </style>
</head>
<body>
    <main>
    <span class="lang-pill" role="group" aria-label="Language / Bahasa">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="id">ID</button>
    </span>
        <div class="code">404</div>
        <h1 data-i18n="not_found">Page not found</h1>
        <p data-i18n="missing">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" data-i18n="back">Back to Home</a>
        <div class="links">
            <a href="/#services" data-i18n="services">Services</a>
            <a href="/#portfolio" data-i18n="portfolio">Portfolio</a>
            <a href="/#contact" data-i18n="contact">Contact</a>
        </div>
    </main>
    <script type="module" src="/js/404-lang.js"></script>
</body>
</html>
