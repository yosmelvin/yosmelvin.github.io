<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Page Not Found | YMT Solution</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css?family=Sora:400,700|Inter:400,600" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#0b1220 0%,#0f172a 55%,#020617 100%);font-family:'Inter',sans-serif;color:#e2e8f0;text-align:center;padding:20px}
        .code{font-family:'Sora',sans-serif;font-size:clamp(6rem,20vw,11rem);font-weight:700;background:linear-gradient(135deg,#22d3ee,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
        h1{font-family:'Sora',sans-serif;font-size:1.6rem;margin:12px 0 8px;color:#f1f5f9}
        p{color:#94a3b8;margin-bottom:32px}
        a{display:inline-block;padding:14px 34px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#0e7490);color:#06121f;font-weight:600;text-decoration:none;transition:transform .25s,box-shadow .25s}
        a:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(34,211,238,.35)}
        .links{margin-top:28px}
        .links a{padding:8px 18px;font-size:.85rem;background:rgba(255,255,255,.06);border:1px solid rgba(148,163,184,.25);color:#cbd5e1;margin:0 6px}
        .links a:hover{border-color:#22d3ee;color:#22d3ee;box-shadow:none}
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/">Back to Home</a>
        <div class="links">
            <a href="/#services">Services</a>
            <a href="/#portfolio">Portfolio</a>
            <a href="/#contact">Contact</a>
        </div>
    </main>
</body>
</html>
